<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#f5f7f5"/>
  
  
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1b5e20">Pine Needles and Cone Adaptations</text>
  
  
  <g transform="translate(80, 50)">
    <rect x="230" y="260" width="20" height="70" fill="#5d4037"/>
    <polygon points="240,30 150,270 330,270" fill="#1b5e20" opacity="0.9"/>
    <polygon points="240,80 170,220 310,220" fill="#2e7d32" opacity="0.85"/>
    <polygon points="240,120 190,180 290,180" fill="#388e3c" opacity="0.8"/>
  </g>
  
  
  <rect x="420" y="60" width="340" height="140" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="590" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1b5e20">Needle Adaptations</text>
  
  
  <g transform="translate(460, 110)">
    <line x1="20" y1="0" x2="20" y2="70" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="5" x2="30" y2="65" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="2" x2="40" y2="68" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="8" x2="50" y2="62" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="3" x2="60" y2="67" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
    <rect x="15" y="-5" width="50" height="12" rx="4" fill="#795548"/>
  </g>
  
  
  <text x="540" y="130" font-family="sans-serif" font-size="12" fill="#333">Fascicle (bundle of 5)</text>
  <text x="540" y="150" font-family="sans-serif" font-size="11" fill="#555">- Reduces water loss</text>
  <text x="540" y="168" font-family="sans-serif" font-size="11" fill="#555">- Small surface area</text>
  <text x="540" y="186" font-family="sans-serif" font-size="11" fill="#555">- Thick waxy cuticle</text>
  
  
  <rect x="420" y="220" width="340" height="150" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="590" y="245" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#bf360c">Pine Cone Structure</text>
  
  
  <g transform="translate(460, 270)">
    <polygon points="30,5 15,25 45,25" fill="#a1887f"/>
    <polygon points="30,20 10,45 50,45" fill="#8d6e63"/>
    <polygon points="30,40 8,70 52,70" fill="#795548"/>
    <polygon points="30,65 12,95 48,95" fill="#6d4c41"/>
    <polygon points="30,90 18,120 42,120" fill="#5d4037"/>
  </g>
  
  
  <text x="540" y="290" font-family="sans-serif" font-size="12" fill="#333"> woody scales protect seeds</text>
  <text x="540" y="310" font-family="sans-serif" font-size="11" fill="#555">- Two seeds per scale</text>
  <text x="540" y="328" font-family="sans-serif" font-size="11" fill="#555">- Open when dry to release</text>
  <text x="540" y="346" font-family="sans-serif" font-size="11" fill="#555">- Some need fire to open</text>
  
  
  <rect x="60" y="340" width="320" height="40" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="220" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b71c1c">Thick bark protects mature pines from moderate wildfires</text>
</svg>