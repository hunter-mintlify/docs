<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#f8fafc" rx="12"/>
  <text x="400" y="36" font-family="sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">African vs Asian Elephant Comparison</text>

  
  <g transform="translate(120, 70)">
    <text x="180" y="0" font-family="sans-serif" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">African Elephant</text>
    
    <ellipse cx="180" cy="120" rx="100" ry="70" fill="#16A34A" opacity="0.15"/>
    
    <path d="M120 100 Q70 60 50 130 Q55 190 110 170" fill="#16A34A" opacity="0.25"/>
    
    <path d="M250 120 Q290 150 270 220 Q260 240 250 220" fill="none" stroke="#16A34A" stroke-width="8" stroke-linecap="round"/>
    
    <path d="M240 135 Q260 170 245 190" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    
    <line x1="50" y1="130" x2="20" y2="110" stroke="#64748b" stroke-width="1"/>
    <text x="10" y="106" font-family="sans-serif" font-size="11" fill="#64748b">Large ears</text>
    <line x1="260" y1="200" x2="290" y2="220" stroke="#64748b" stroke-width="1"/>
    <text x="295" y="230" font-family="sans-serif" font-size="11" fill="#64748b">Trunk with 2 finger-like lips</text>
  </g>

  
  <g transform="translate(460, 70)">
    <text x="110" y="0" font-family="sans-serif" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Asian Elephant</text>
    
    <ellipse cx="110" cy="120" rx="85" ry="65" fill="#16A34A" opacity="0.15"/>
    
    <path d="M65 100 Q40 80 35 130 Q40 170 75 160" fill="#16A34A" opacity="0.25"/>
    
    <path d="M170 120 Q200 150 185 210 Q175 225 170 210" fill="none" stroke="#16A34A" stroke-width="7" stroke-linecap="round"/>
    
    <path d="M165 132 Q175 155 168 170" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    
    <line x1="40" y1="130" x2="15" y2="115" stroke="#64748b" stroke-width="1"/>
    <text x="5" y="110" font-family="sans-serif" font-size="11" fill="#64748b">Small ears</text>
    <line x1="175" y1="195" x2="210" y2="215" stroke="#64748b" stroke-width="1"/>
    <text x="215" y="225" font-family="sans-serif" font-size="11" fill="#64748b">Trunk with 1 finger-like lip</text>
  </g>

  
  <line x1="400" y1="80" x2="400" y2="280" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>

  
  <rect x="40" y="300" width="720" height="80" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="400" y="324" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Comparative Statistics</text>
  
  <text x="120" y="354" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Shoulder Height</text>
  <text x="120" y="372" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">3-4 m vs 2-3.5 m</text>

  <text x="320" y="354" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Weight</text>
  <text x="320" y="372" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">~6,350 kg vs ~5,400 kg</text>

  <text x="520" y="354" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Back Shape</text>
  <text x="520" y="372" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Concave vs Convex</text>

  <text x="680" y="354" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Skin Texture</text>
  <text x="680" y="372" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Wrinkled vs Smoother</text>
</svg>