<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="36" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">Lime Varieties Comparison</text>

  
  <ellipse cx="220" cy="170" rx="75" ry="55" fill="#86efac"/>
  <ellipse cx="220" cy="170" rx="68" ry="48" fill="#4ade80"/>
  <path d="M220 115 L220 95" stroke="#16a34a" stroke-width="3"/>
  <ellipse cx="220" cy="91" rx="10" ry="5" fill="#16a34a"/>
  <text x="220" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Persian (Tahitian)</text>
  <text x="220" y="280" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">Larger, less acidic</text>
  <text x="220" y="298" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">~5-6 cm diameter</text>

  
  <ellipse cx="580" cy="170" rx="50" ry="40" fill="#86efac"/>
  <ellipse cx="580" cy="170" rx="44" ry="34" fill="#4ade80"/>
  <path d="M580 130 L580 115" stroke="#16a34a" stroke-width="3"/>
  <ellipse cx="580" cy="111" rx="8" ry="4" fill="#16a34a"/>
  <text x="580" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Key lime</text>
  <text x="580" y="280" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">Smaller, more aromatic</text>
  <text x="580" y="298" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">~3-4 cm diameter</text>

  
  <line x1="150" y1="340" x2="650" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="150" y1="335" x2="150" y2="345" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="650" y1="335" x2="650" y2="345" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="360" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Relative size comparison</text>

  
  <rect x="280" y="80" width="240" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="105" font-family="sans-serif" font-size="12" fill="#1e293b" text-anchor="middle">Both varieties belong to</text>
  <text x="400" y="122" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">the Rutaceae family</text>
</svg>