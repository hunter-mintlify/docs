  <path d="M305 134 L305 150" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/>
  <text x="305" y="172" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Mammary Glands</text>
  <text x="305" y="192" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Milk for young</text>

  
  <rect x="410" y="68" width="170" height="140" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <rect x="430" y="88" width="130" height="70" fill="#16A34A" opacity="0.08" rx="6"/>
  
  <circle cx="470" cy="120" r="7" fill="#16A34A"/>
  <circle cx="495" cy="120" r="7" fill="#16A34A"/>
  <circle cx="520" cy="120" r="7" fill="#16A34A"/>
  <line x1="470" y1="120" x2="495" y2="120" stroke="#16A34A" stroke-width="2"/>
  <line x1="495" y1="120" x2="520" y2="120" stroke="#16A34A" stroke-width="2"/>
  <text x="495" y="172" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Three Ear Bones</text>
  <text x="495" y="192" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Malleus, incus, stapes</text>

  
  <rect x="600" y="68" width="170" height="140" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <rect x="620" y="88" width="130" height="70" fill="#16A34A" opacity="0.08" rx="6"/>
  
  <rect x="678" y="95" width="14" height="56" fill="#ffffff" stroke="#16A34A" stroke-width="2" rx="7"/>
  <rect x="681" y="105" width="8" height="36" fill="#16A34A" rx="4"/>
  <circle cx="685" cy="150" r="6" fill="#dc2626"/>
  <text x="685" y="172" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Warm-blooded</text>
  <text x="685" y="192" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Constant body temp</text>

  
  <rect x="30" y="230" width="740" height="140" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="400" y="262" font-family="sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Evolutionary Divergence</text>
  
  <line x1="70" y1="310" x2="730" y2="310" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="130" cy="310" r="8" fill="#16A34A"/>
  <text x="130" y="340" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Carboniferous</text>
