  <rect width="800" height="400" fill="#f8fafc" rx="12"/>
  <text x="400" y="44" font-family="sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Mammalian Key Traits</text>

  
  <rect x="30" y="68" width="170" height="140" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <rect x="50" y="88" width="130" height="70" fill="#16A34A" opacity="0.08" rx="6"/>
  
  <line x1="65" y1="100" x2="165" y2="100" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="112" x2="165" y2="112" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="124" x2="165" y2="124" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="136" x2="165" y2="136" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  <text x="115" y="172" font-family="sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Hair or Fur</text>
  <text x="115" y="192" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Insulation &amp; sensory</text>

  
  <rect x="220" y="68" width="170" height="140" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <rect x="240" y="88" width="130" height="70" fill="#16A34A" opacity="0.08" rx="6"/>
  <circle cx="305" cy="120" r="14" fill="#16A34A" opacity="0.2"/>
