  <text x="130" y="290" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Synapsids branch off</text>

  <circle cx="400" cy="310" r="8" fill="#16A34A"/>
  <text x="400" y="340" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Triassic</text>
  <text x="400" y="356" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">~200 mya</text>
  <text x="400" y="290" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">First true mammals</text>

  <circle cx="670" cy="310" r="8" fill="#16A34A"/>
  <text x="670" y="340" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Cretaceous-Paleogene</text>
  <text x="670" y="356" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">~66 mya</text>
  <text x="670" y="290" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Mammalian radiation</text>
