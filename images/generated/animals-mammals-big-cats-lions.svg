<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#f8fafc" rx="12"/>
  <text x="400" y="36" font-family="sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Lion Pride Social Structure</text>

  
  <ellipse cx="400" cy="210" rx="350" ry="130" fill="#16A34A" opacity="0.08" stroke="#16A34A" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="118" font-family="sans-serif" font-size="12" fill="#16A34A" text-anchor="middle">Pride Territory</text>

  
  <rect x="80" y="145" width="220" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="190" y="168" font-family="sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Related Females</text>
  <text x="190" y="188" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">2-18 adult females</text>
  
  
  <circle cx="140" cy="220" r="14" fill="#16A34A" opacity="0.2"/>
  <circle cx="140" cy="220" r="7" fill="#16A34A"/>
  <text x="140" y="248" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Female 1</text>
  
  <circle cx="190" cy="220" r="14" fill="#16A34A" opacity="0.2"/>
  <circle cx="190" cy="220" r="7" fill="#16A34A"/>
  <text x="190" y="248" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Female 2</text>
  
  <circle cx="240" cy="220" r="14" fill="#16A34A" opacity="0.2"/>
  <circle cx="240" cy="220" r="7" fill="#16A34A"/>
  <text x="240" y="248" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Female 3</text>

  <text x="190" y="292" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Primary hunters</text>
  <text x="190" y="310" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Raise cubs together</text>

  
  <rect x="500" y="145" width="220" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="610" y="168" font-family="sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Male Coalition</text>
  <text x="610" y="188" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">1-7 males (often brothers)</text>
  
  
  <circle cx="570" cy="220" r="14" fill="#16A34A" opacity="0.2"/>
  <circle cx="570" cy="220" r="7" fill="#16A34A"/>
  <rect x="558" y="206" width="24" height="7" fill="#16A34A" opacity="0.4" rx="3"/>
  <text x="570" y="248" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Male 1</text>
  
  <circle cx="620" cy="220" r="14" fill="#16A34A" opacity="0.2"/>
  <circle cx="620" cy="220" r="7" fill="#16A34A"/>
  <rect x="608" y="206" width="24" height="7" fill="#16A34A" opacity="0.4" rx="3"/>
  <text x="620" y="248" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Male 2</text>

  <circle cx="670" cy="220" r="14" fill="#16A34A" opacity="0.2"/>
  <circle cx="670" cy="220" r="7" fill="#16A34A"/>
  <rect x="658" y="206" width="24" height="7" fill="#16A34A" opacity="0.4" rx="3"/>
  <text x="670" y="248" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Male 3</text>

  <text x="610" y="292" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Defend territory</text>
  <text x="610" y="310" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Patrol borders</text>

  
  <circle cx="400" cy="260" r="12" fill="#fbbf24" opacity="0.25"/>
  <circle cx="400" cy="260" r="6" fill="#f59e0b"/>
  <text x="400" y="288" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Cubs</text>
  <text x="400" y="304" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Raised communally</text>

  
  <path d="M300 220 L330 220" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470 220 L500 220" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>