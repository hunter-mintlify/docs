<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#f8fafc" rx="12"/>
  <text x="400" y="36" font-family="sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Owl Sensory and Flight Adaptations</text>

  
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="320" height="280" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="160" y="24" font-family="sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Head &amp; Hearing</text>
    
    
    <circle cx="160" cy="130" r="70" fill="#16A34A" opacity="0.1" stroke="#16A34A" stroke-width="2"/>
    
    <path d="M110 130 Q160 90 210 130" fill="none" stroke="#16A34A" stroke-width="2" opacity="0.5"/>
    <path d="M110 130 Q160 170 210 130" fill="none" stroke="#16A34A" stroke-width="2" opacity="0.5"/>
    
    <circle cx="135" cy="125" r="14" fill="#1f2937"/>
    <circle cx="135" cy="125" r="6" fill="#fbbf24"/>
    <circle cx="185" cy="125" r="14" fill="#1f2937"/>
    <circle cx="185" cy="125" r="6" fill="#fbbf24"/>
    
    <polygon points="160,142 154,158 166,158" fill="#f59e0b"/>
    
    
    <ellipse cx="105" cy="130" rx="6" ry="14" fill="#dc2626" opacity="0.3"/>
    <ellipse cx="215" cy="130" rx="6" ry="10" fill="#dc2626" opacity="0.3"/>
    
    
    <line x1="105" y1="150" x2="75" y2="170" stroke="#64748b" stroke-width="1"/>
    <text x="65" y="185" font-family="sans-serif" font-size="11" fill="#64748b">Large ear opening</text>
    <line x1="215" y1="150" x2="245" y2="170" stroke="#64748b" stroke-width="1"/>
    <text x="250" y="185" font-family="sans-serif" font-size="11" fill="#64748b">Smaller opening</text>
    <text x="160" y="225" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Asymmetric ears locate prey in darkness</text>
    <text x="160" y="242" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Facial disc funnels sound to ears</text>
  </g>

  
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="340" height="280" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>
    <text x="170" y="24" font-family="sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Silent Flight Feathers</text>
    
    
    <rect x="20" y="45" width="135" height="95" fill="#f8fafc" rx="6"/>
    <text x="87" y="62" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle">Typical Bird Feather</text>
    <line x1="87" y1="75" x2="87" y2="120" stroke="#94a3b8" stroke-width="3"/>
    <line x1="55" y1="90" x2="87" y2="85" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="119" y1="90" x2="87" y2="85" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="55" y1="100" x2="87" y2="95" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="119" y1="100" x2="87" y2="95" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="55" y1="110" x2="87" y2="105" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="119" y1="110" x2="87" y2="105" stroke="#cbd5e1" stroke-width="2"/>
    <text x="87" y="132" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Smooth edges = audible airflow</text>

    
    <rect x="185" y="45" width="135" height="95" fill="#f8fafc" rx="6"/>
    <text x="252" y="62" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle">Owl Flight Feather</text>
    <line x1="252" y1="75" x2="252" y2="120" stroke="#16A34A" stroke-width="3"/>
    
    <path d="M220 90 L225 86 L230 92 L235 85 L240 93 L245 84 L252 88" fill="none" stroke="#16A34A" stroke-width="2"/>
    <path d="M220 100 L225 96 L230 102 L235 95 L240 103 L245 94 L252 98" fill="none" stroke="#16A34A" stroke-width="2"/>
    <path d="M220 110 L225 106 L230 112 L235 105 L240 113 L245 104 L252 108" fill="none" stroke="#16A34A" stroke-width="2"/>
    
    <path d="M252 85 L284 88 L280 92 L252 90" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M252 95 L284 98 L280 102 L252 100" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M252 105 L284 108 L280 112 L252 110" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="252" y="132" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Serrated leading edge = silent</text>

    
    <rect x="20" y="155" width="300" height="105" fill="#f8fafc" rx="6"/>
    <text x="170" y="174" font-family="sans-serif" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle">Velvet-like Down Absorbs Sound</text>
    <rect x="50" y="190" width="240" height="24" fill="#16A34A" opacity="0.15" rx="4"/>
    <text x="170" y="206" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Soft, porous surface layer dampens turbulence</text>
    <rect x="50" y="222" width="240" height="24" fill="#16A34A" opacity="0.15" rx="4"/>
    <text x="170" y="238" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Fringed trailing edge breaks air into micro-vortices</text>
  </g>
</svg>