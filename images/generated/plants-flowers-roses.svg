<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#fdf5f5"/>
  
  
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#880e4f">Rose Flower Anatomy</text>
  
  
  <g transform="translate(80, 60)">
    
    <line x1="200" y1="180" x2="200" y2="300" stroke="#2e7d32" stroke-width="6"/>
    
    
    <polygon points="200,220 190,215 200,210" fill="#5d4037"/>
    <polygon points="200,260 212,255 200,250" fill="#5d4037"/>
    
    
    <ellipse cx="165" cy="230" rx="22" ry="10" fill="#4caf50" transform="rotate(-30 165 230)"/>
    <ellipse cx="235" cy="240" rx="22" ry="10" fill="#4caf50" transform="rotate(30 235 240)"/>
    <ellipse cx="160" cy="265" rx="20" ry="9" fill="#66bb6a" transform="rotate(-20 160 265)"/>
    
    
    <polygon points="200,180 185,165 195,175 200,160 205,175 215,165" fill="#2e7d32"/>
    
    
    <ellipse cx="200" cy="130" rx="55" ry="50" fill="#e91e63" opacity="0.7"/>
    <ellipse cx="200" cy="125" rx="45" ry="42" fill="#f06292" opacity="0.8"/>
    <ellipse cx="200" cy="120" rx="35" ry="35" fill="#f48fb1" opacity="0.85"/>
    <ellipse cx="200" cy="115" rx="25" ry="28" fill="#f8bbd0" opacity="0.9"/>
    <ellipse cx="200" cy="110" rx="15" ry="18" fill="#fce4ec" opacity="0.95"/>
  </g>
  
  
  <line x1="340" y1="130" x2="400" y2="110" stroke="#555" stroke-width="1.5"/>
  <text x="410" y="115" font-family="sans-serif" font-size="13" fill="#333">Petals - showy, attract pollinators</text>
  
  <line x1="295" y1="205" x2="400" y2="185" stroke="#555" stroke-width="1.5"/>
  <text x="410" y="190" font-family="sans-serif" font-size="13" fill="#333">Sepals - protect the developing bud</text>
  
  <line x1="290" y1="280" x2="400" y2="260" stroke="#555" stroke-width="1.5"/>
  <text x="410" y="265" font-family="sans-serif" font-size="13" fill="#333">Thorns (prickles) - stem defense</text>
  
  <line x1="270" y1="320" x2="400" y2="310" stroke="#555" stroke-width="1.5"/>
  <text x="410" y="315" font-family="sans-serif" font-size="13" fill="#333">Compound leaves - pinnate arrangement</text>
  
  
  <rect x="420" y="55" width="340" height="130" rx="8" fill="#fff0f5" stroke="#e91e63" stroke-width="1.5"/>
  <text x="590" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#880e4f">Flower Cross-Section</text>
  
  <g transform="translate(470, 100)">
    
    <ellipse cx="50" cy="50" rx="45" ry="40" fill="#f06292" opacity="0.5"/>
    
    <ellipse cx="50" cy="50" rx="30" ry="28" fill="#f48fb1" opacity="0.6"/>
    
    <circle cx="50" cy="50" r="18" fill="none" stroke="#ffeb3b" stroke-width="8" stroke-dasharray="4,6"/>
    <circle cx="50" cy="50" r="18" fill="none" stroke="#fbc02d" stroke-width="2" stroke-dasharray="2,8"/>
    
    <ellipse cx="50" cy="50" rx="6" ry="20" fill="#8bc34a"/>
    <circle cx="50" cy="30" r="5" fill="#cddc39"/>
    
    <text x="110" y="40" font-family="sans-serif" font-size="11" fill="#333">Stamens (male)</text>
    <text x="110" y="65" font-family="sans-serif" font-size="11" fill="#333">Pistil (female)</text>
  </g>
  
  
  <rect x="420" y="205" width="340" height="170" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="590" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">Rose Color Symbolism</text>
  
  <circle cx="460" cy="255" r="10" fill="#d32f2f"/>
  <text x="485" y="260" font-family="sans-serif" font-size="12" fill="#333">Red - Love and passion</text>
  
  <circle cx="460" cy="285" r="10" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="485" y="290" font-family="sans-serif" font-size="12" fill="#333">White - Purity and innocence</text>
  
  <circle cx="460" cy="315" r="10" fill="#fbc02d"/>
  <text x="485" y="320" font-family="sans-serif" font-size="12" fill="#333">Yellow - Friendship and joy</text>
  
  <circle cx="460" cy="345" r="10" fill="#e91e63"/>
  <text x="485" y="350" font-family="sans-serif" font-size="12" fill="#333">Pink - Gratitude and admiration</text>
  
  <circle cx="630" cy="255" r="10" fill="#7b1fa2"/>
  <text x="655" y="260" font-family="sans-serif" font-size="12" fill="#333">Purple - Enchantment</text>
  
  <circle cx="630" cy="285" r="10" fill="#ff9800"/>
  <text x="655" y="290" font-family="sans-serif" font-size="12" fill="#333">Orange - Desire</text>
</svg>