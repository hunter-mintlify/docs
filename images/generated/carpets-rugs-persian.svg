  <rect x="60" y="90" width="25" height="220" fill="#8b0000"/>
  <rect x="355" y="90" width="25" height="220" fill="#8b0000"/>
  
  
  <rect x="85" y="90" width="270" height="8" fill="#b8860b"/>
