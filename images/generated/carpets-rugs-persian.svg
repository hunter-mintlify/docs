    <rect x="8" y="16" width="5" height="5" fill="#16A34A"/>
    <rect x="16" y="16" width="5" height="5" fill="#16A34A"/>
    <rect x="24" y="16" width="5" height="5" fill="#16A34A"/>
  </g>
  
  
  <rect x="430" y="240" width="310" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="585" y="265" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Traditional Materials</text>
  
  <rect x="455" y="285" width="16" height="16" fill="#fdf6e3" stroke="#d4a574" stroke-width="1"/>
  <text x="480" y="297" font-family="sans-serif" font-size="12" fill="#475569">Cotton foundation (warp &amp; weft)</text>
  
  <rect x="455" y="310" width="16" height="16" fill="#b8860b" opacity="0.6"/>
  <text x="480" y="322" font-family="sans-serif" font-size="12" fill="#475569">Wool pile (most common)</text>
  
  <rect x="455" y="335" width="16" height="16" fill="#16A34A" opacity="0.5"/>
  <text x="480" y="347" font-family="sans-serif" font-size="12" fill="#475569">Silk pile (finest luxury rugs)</text>
  
  
  <text x="220" y="360" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Example medallion-and-corner layout typical of Tabriz, Kashan, and Isfahan styles</text>
