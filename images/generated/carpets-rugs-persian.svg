<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <text x="400" y="35" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Persian Rug: Anatomy of a Hand-Knotted Weave</text>
  
  
  <rect x="60" y="60" width="320" height="280" rx="4" fill="#fdf6e3" stroke="#d4a574" stroke-width="3"/>
  
  
  <rect x="60" y="60" width="320" height="30" fill="#8b0000"/>
