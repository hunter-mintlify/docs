    <circle cx="220" cy="100" r="6" fill="#b8860b" opacity="0.6"/>
    <circle cx="220" cy="240" r="6" fill="#b8860b" opacity="0.6"/>
  </g>
  
  
  <rect x="430" y="60" width="310" height="160" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="585" y="85" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Knot Density Scale</text>
  
  
  <text x="455" y="115" font-family="sans-serif" font-size="11" fill="#64748b">Coarse (50-100 KPSI)</text>
  <g transform="translate(610, 100)">
    <rect x="0" y="0" width="10" height="10" fill="#d4a574"/>
    <rect x="20" y="0" width="10" height="10" fill="#d4a574"/>
    <rect x="0" y="20" width="10" height="10" fill="#d4a574"/>
    <rect x="20" y="20" width="10" height="10" fill="#d4a574"/>
  </g>
  
  
  <text x="455" y="150" font-family="sans-serif" font-size="11" fill="#64748b">Medium (150-300 KPSI)</text>
