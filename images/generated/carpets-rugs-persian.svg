  <polygon points="93,100 140,100 93,150" fill="#16A34A" opacity="0.7"/>
  <polygon points="307,100 357,100 357,150" fill="#16A34A" opacity="0.7"/>
  <polygon points="93,290 140,290 93,240" fill="#16A34A" opacity="0.7"/>
  <polygon points="307,290 357,290 357,240" fill="#16A34A" opacity="0.7"/>
  
  
  <g id="floral-motifs">
    <circle cx="140" cy="170" r="10" fill="#b8860b" opacity="0.7"/>
    <circle cx="300" cy="170" r="10" fill="#b8860b" opacity="0.7"/>
    <circle cx="170" cy="130" r="8" fill="#16A34A" opacity="0.5"/>
    <circle cx="270" cy="130" r="8" fill="#16A34A" opacity="0.5"/>
    <circle cx="170" cy="210" r="8" fill="#16A34A" opacity="0.5"/>
